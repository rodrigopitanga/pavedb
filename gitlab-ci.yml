stages:
  - mirror
  - test
  - benchmark
  - security
  - release
  - announce

image: python:3.11

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GET_SOURCES_ATTEMPTS: "3"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  SAST_STAGE: security
  SECRET_DETECTION_STAGE: security
  SECRET_DETECTION_ENABLED: "true"

cache:
  paths:
    - .cache/pip
    - .cache/huggingface

mirror-github:
  stage: mirror
  image: alpine:3.20
  variables:
    GITHUB_MIRROR_REPO: rodrigopitanga/pavedb
    # Full history: the push has to prove it fast-forwards the GitHub tip,
    # which the default shallow fetch cannot once the default branch has
    # advanced at least GIT_DEPTH commits since the last mirrored release.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - git remote remove github-mirror 2>/dev/null || true
    - |
      github_url="https://x-access-token:${GITHUB_MIRROR_TOKEN}"
      github_url="${github_url}@github.com/${GITHUB_MIRROR_REPO}.git"
      git remote add github-mirror "$github_url"
    - |
      main_ref="+refs/heads/${CI_DEFAULT_BRANCH}:"
      main_ref="${main_ref}refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      git fetch origin "$main_ref"
    - git fetch origin "+refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
    - |
      main_dst="refs/remotes/origin/${CI_DEFAULT_BRANCH}:"
      main_dst="${main_dst}refs/heads/${CI_DEFAULT_BRANCH}"
      git push github-mirror "$main_dst"
    - git push github-mirror "refs/tags/${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

issue-key-sync:
  stage: test
  script:
    - python scripts/issue_key_sync.py
  rules:
    - if: '$GITLAB_ISSUE_TOKEN && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$GITLAB_ISSUE_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Full reconcile: close every open issue already fixed on the default branch,
# catching anything a push-scoped run missed (transient failure, no runner).
# Schedule-only + GIT_DEPTH:0 so this heavier pass never loads the frequent
# commit jobs. Add a scheduled pipeline (Build > Pipeline schedules) to run it.
issue-reconcile:
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - python scripts/issue_key_sync.py --reconcile
  rules:
    - if: '$GITLAB_ISSUE_TOKEN && $CI_PIPELINE_SOURCE == "schedule"'

sqlite-fts:
  stage: test
  image: $PYTHON_IMAGE
  parallel:
    matrix:
      - PYTHON_IMAGE:
          - "python:3.10"
          - "python:3.11"
          - "python:3.11-slim"
          - "python:3.12"
          - "python:3.13"
          - "python:3.14"
  script:
    - python scripts/check_sqlite_fts.py

validate-release-announcement:
  stage: test
  script:
    - >-
      python scripts/validate_release_announcement.py "$CI_COMMIT_TAG"
      > release-title.txt
    - |
      {
        cat "docs/RELEASE-${CI_COMMIT_TAG}.md"
        sed '1d' "docs/RELEASE-${CI_COMMIT_TAG}_pt.md"
      } > release-notes.md
  artifacts:
    paths:
      - release-title.txt
      - release-notes.md
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

# The suite runs in two tiers, the same split as `make test-fast` and
# `make test`. The full suite outgrew a merge-path budget: on 2026-10-30 the
# untagged runner spent 9m20s on the installs and 30m30s in `pytest -q`,
# reaching 939 of ~940 tests with no failure and no stall before the 40m cap
# killed it (job 17617632088, branch pipeline for bug/bench-runner). Nothing
# hung and nothing regressed — the full suite just costs more wall clock than
# every merge should pay. So the merge path runs the fast tier and the full
# suite stays mandatory where it gates a release.
#
# This buys headroom; it does not make the suite fast. The fast tier is still
# ~22-25m of that trace, and 19m of wall clock for 4m24s of user CPU locally:
# four fifths of it is tests waiting, not working (P3-56 —
# test_concurrent_upsert_with_manual_lock alone waits 60-107s, depending on
# how loaded the host is). Keeping the suite inside one job budget is still
# P3-55. Both stay open.
#
# Each budget below is the worst measured case: the installs plus the tier at
# the slowest runner speed on record (2026-10-21, job 17358079926 — ~11m of
# installs and 53% of the suite in 25m, ~1.5x slower than the trace above).
.pytest-tier:
  stage: test
  before_script:
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
  # A suite that ran out of wall clock runs out again: on 2026-10-21 the
  # default stuck_or_timeout_failure retry re-ran three timed-out suites at
  # the same second and spent two runner-hours learning nothing. Every other
  # job keeps that retry — the tagged ones need it when their one runner
  # reports stuck — but the suite only retries a runner that dies under it.
  retry:
    max: 2
    when:
      - runner_system_failure
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
      - .pytest_cache
    expire_in: 1 week

# Merge path: the fast tier, FakeEmbedder only. ~32-34m measured, ~48m at the
# slowest observed speed — so 40m was never enough for this suite on a bad
# day, tier or no tier, and the cap is sized rather than guessed.
pytest:
  extends: .pytest-tier
  timeout: 55m
  script:
    - pytest -q -m "not slow" --junitxml=junit.xml --durations=25
  # Without rules this defaulted to branch/tag pipelines only, so it never ran
  # on merge-request pipelines: every MR merged on bench alone while the suite
  # was red on the push pipeline, unread. Gate the MR here and the default
  # branch in pytest-full, so a red suite blocks the merge. A branch with an
  # open MR is tested by the MR pipeline; one without would otherwise never
  # run the suite at all.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'

# Release path: the full suite, real embeddings included, mandatory on the
# default branch and on every tag. `make release` runs the same full suite
# locally before it tags; this is the gate that proves the merged result.
# ~40m measured, ~58m at the slowest observed speed, and a timeout here
# blocks a release rather than a merge, so it keeps the wider margin.
pytest-full:
  extends: .pytest-tier
  timeout: 75m
  script:
    - pytest -q --junitxml=junit.xml --durations=25
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Release gate for the published architecture. The images have been arm64
# since the runner moved (ROADMAP C7) and nothing tested that: the untagged
# suite runs on the shared amd64 image, so the artifact people actually pull
# was the one architecture with no test run against it.
#
# Final tags only, on our own runner. rc and artifact refreshes are not
# worth the wall time here, and no SaaS minutes are spent.
#
# Note this does NOT cover macOS. pave/embedders/sbert.py branches on
# sys.platform == "darwin" (torch in-process crashes alongside FAISS there,
# so the SBERT runtime is forced into a subprocess), and colima is a Linux
# VM — its runner reports platform=linux, so that branch stays unexercised.
# Testing it needs a shell-executor runner on a real macOS host.
pytest-arm64:
  stage: test
  tags:
    - m4-colima
  image: python:3.11
  script:
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
    - python -c "import platform, sys; print('arch:', platform.machine(), '| platform:', sys.platform)"
    - pytest -q --junitxml=junit.xml --durations=25
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 1 week
  rules:
    # Must match publish-docker's tag pattern exactly, including the
    # optional fourth component (v0.9.3.1 and v0.5.8.1 are real tags).
    # A tag that publishes an image but skips this job would ship the
    # arm64 artifact untested — the hole this job exists to close.
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

bench:
  stage: benchmark
  # The p99 SLO was calibrated on GitLab SaaS runners (search p99 ~280ms).
  # The shared xeon group runner measures ~2.3s for the same run and fails
  # it, so the latency gate runs on our own idle runner, like the release jobs.
  tags:
    - m4-colima
  variables:
    # Cold local runners download the model on first run; give startup headroom.
    BENCH_STARTUP_TIMEOUT_S: "120"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git make
  script:
    - >-
      LAT_SLO_P99_MS=${LAT_SLO_P99_MS:-2000}
      STR_MAX_ERROR_PCT=${STR_MAX_ERROR_PCT:-1}
      BENCH_FORCE_EPHEMERAL=1
      BENCH_SAVE=1
      LAT_LENGTH=${LAT_LENGTH:-200}
      LAT_CONCUR=${LAT_CONCUR:-8}
      STR_LENGTH=${STR_LENGTH:-30}
      STR_CONCUR=${STR_CONCUR:-4}
      TORCH_WHEEL_CPU=1
      make benchmark
  artifacts:
    when: always
    paths:
      - benchmarks/results/
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

chaos-nightly:
  stage: benchmark
  tags:
    - jaeger
  variables:
    BENCH_FORCE_EPHEMERAL: "1"
    BENCH_STARTUP_TIMEOUT_S: "120"
    TORCH_WHEEL_CPU: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git make
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
  script:
    - >-
      bash -o pipefail -c
      'CHAOS_DURATION="${CHAOS_DURATION:-120}"
      CHAOS_CONCUR="${CHAOS_CONCUR:-24}"
      make chaos 2>&1 | tee chaos.log'
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        python scripts/issue_key_sync.py chaos-failure
      fi
  artifacts:
    when: always
    paths:
      - chaos.log
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true

# PyPI publish for final releases only (vX.Y.Z)
publish-pypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - test -n "${PYPI_TOKEN:-}" || { echo "PYPI_TOKEN is missing"; exit 1; }
    - export TWINE_USERNAME="__token__"
    - export TWINE_PASSWORD="${PYPI_TOKEN}"
    - twine upload dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

# GitLab PyPI: all versioned tags (final, rc, alpha, beta, etc.)
publish-gitlab-pypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - |
      test -n "${CI_DEPLOY_USER:-}" || { echo "CI_DEPLOY_USER is missing"; exit 1; }
      test -n "${CI_DEPLOY_PASSWORD:-}" || { echo "CI_DEPLOY_PASSWORD is missing"; exit 1; }
    - twine upload --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/* -u "$CI_DEPLOY_USER" -p "$CI_DEPLOY_PASSWORD"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}\S{0,16}$/'

# Test PyPI: release candidates only (vX.Y.Zrc0-rc999)
publish-testpypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - test -n "${TEST_PYPI_TOKEN:-}" || { echo "TEST_PYPI_TOKEN is missing"; exit 1; }
    - export TWINE_USERNAME="__token__"
    - export TWINE_PASSWORD="${TEST_PYPI_TOKEN}"
    - twine upload --repository-url "https://test.pypi.org/legacy/" dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}rc\d{1,3}$/'

# Docker: release candidates (CPU only)
publish-docker-rc:
  stage: release
  tags:
    - jaeger
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export IMAGE_BASE="$CI_REGISTRY_IMAGE/pavedb"
    - export IMAGE_TAG="$VERSION-cpu"
    - export LATEST_TAG="latest-cpu"
    - export BUILD_ID="${CI_PIPELINE_ID:-0}-${CI_COMMIT_SHORT_SHA:-dev}-cpu"
    - docker build --progress=plain --build-arg TORCH_WHEEL_CPU=1 --build-arg BUILD_ID="$BUILD_ID" -t "$IMAGE_BASE:$IMAGE_TAG" -f Dockerfile .
    - docker push "$IMAGE_BASE:$IMAGE_TAG"
    - docker tag "$IMAGE_BASE:$IMAGE_TAG" "$IMAGE_BASE:$LATEST_TAG"
    - docker push "$IMAGE_BASE:$LATEST_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}rc\d{1,3}$/'

# Docker: final releases — CPU image only. CUDA is disabled here; build it
# locally with `make docker-build RELEASE_TORCH=cuda` (or `=both`). See
# THIRD_PARTY_LICENSES.md for why the published image stays CPU-only.
publish-docker:
  stage: release
  tags:
    - jaeger
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export IMAGE_BASE="$CI_REGISTRY_IMAGE/pavedb"
    - export BUILD_ID_CPU="${CI_PIPELINE_ID:-0}-${CI_COMMIT_SHORT_SHA:-dev}-cpu"
    - docker build --progress=plain --build-arg TORCH_WHEEL_CPU=1 --build-arg BUILD_ID="$BUILD_ID_CPU" -t "$IMAGE_BASE:$VERSION-cpu" -f Dockerfile .
    - docker push "$IMAGE_BASE:$VERSION-cpu"
    - docker tag "$IMAGE_BASE:$VERSION-cpu" "$IMAGE_BASE:latest-cpu"
    - docker push "$IMAGE_BASE:latest-cpu"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

announce-gitlab:
  stage: announce
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  dependencies:
    - validate-release-announcement
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "$(cat release-title.txt)" \
        --notes-file "release-notes.md" \
        --ref "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

announce-github:
  stage: announce
  image: alpine:3.20
  variables:
    GITHUB_MIRROR_REPO: rodrigopitanga/pavedb
  dependencies:
    - validate-release-announcement
  before_script:
    - apk add --no-cache git github-cli
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - export GH_TOKEN="$GITHUB_MIRROR_TOKEN"
    - |
      git ls-remote --exit-code \
        "https://github.com/${GITHUB_MIRROR_REPO}.git" \
        "refs/tags/${CI_COMMIT_TAG}"
    - |
      title="$(cat release-title.txt)"
      notes="release-notes.md"
      if gh release view "$CI_COMMIT_TAG" \
        --repo "$GITHUB_MIRROR_REPO" >/dev/null 2>&1
      then
        gh release edit "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --title "$title" --notes-file "$notes" --verify-tag
      else
        gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --title "$title" --notes-file "$notes" --verify-tag
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
