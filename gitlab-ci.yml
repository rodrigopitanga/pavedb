stages:
  - mirror
  - test
  - benchmark
  - security
  - release
  - announce

image: python:3.11

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GET_SOURCES_ATTEMPTS: "3"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  SAST_STAGE: security
  SECRET_DETECTION_STAGE: security
  SECRET_DETECTION_ENABLED: "true"

cache:
  paths:
    - .cache/pip
    - .cache/huggingface

mirror-github:
  stage: mirror
  image: alpine:3.20
  variables:
    GITHUB_MIRROR_REPO: rodrigopitanga/pavedb
    # Full history: the push has to prove it fast-forwards the GitHub tip,
    # which the default shallow fetch cannot once the default branch has
    # advanced at least GIT_DEPTH commits since the last mirrored release.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - git remote remove github-mirror 2>/dev/null || true
    - |
      github_url="https://x-access-token:${GITHUB_MIRROR_TOKEN}"
      github_url="${github_url}@github.com/${GITHUB_MIRROR_REPO}.git"
      git remote add github-mirror "$github_url"
    - |
      main_ref="+refs/heads/${CI_DEFAULT_BRANCH}:"
      main_ref="${main_ref}refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      git fetch origin "$main_ref"
    - git fetch origin "+refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
    - |
      main_dst="refs/remotes/origin/${CI_DEFAULT_BRANCH}:"
      main_dst="${main_dst}refs/heads/${CI_DEFAULT_BRANCH}"
      git push github-mirror "$main_dst"
    - git push github-mirror "refs/tags/${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

issue-key-sync:
  stage: test
  script:
    - python scripts/issue_key_sync.py
  rules:
    - if: '$GITLAB_ISSUE_TOKEN && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$GITLAB_ISSUE_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Full reconcile: close every open issue already fixed on the default branch,
# catching anything a push-scoped run missed (transient failure, no runner).
# Schedule-only + GIT_DEPTH:0 so this heavier pass never loads the frequent
# commit jobs. Add a scheduled pipeline (Build > Pipeline schedules) to run it.
issue-reconcile:
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - python scripts/issue_key_sync.py --reconcile
  rules:
    - if: '$GITLAB_ISSUE_TOKEN && $CI_PIPELINE_SOURCE == "schedule"'

validate-release-announcement:
  stage: test
  script:
    - >-
      python scripts/validate_release_announcement.py "$CI_COMMIT_TAG"
      > release-title.txt
    - |
      {
        cat "docs/RELEASE-${CI_COMMIT_TAG}.md"
        sed '1d' "docs/RELEASE-${CI_COMMIT_TAG}_pt.md"
      } > release-notes.md
  artifacts:
    paths:
      - release-title.txt
      - release-notes.md
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

pytest:
  stage: test
  script:
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
    - pytest -q
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
      - .pytest_cache
    expire_in: 1 week

# Release gate for the macOS port. pave/embedders/sbert.py forces the
# SBERT subprocess runtime when sys.platform == "darwin" and the backend is
# FAISS (torch in-process crashes alongside FAISS there) — a branch no
# Linux job can reach, so before this the port was documented in
# RELEASE-v0.9.0 and never exercised by CI.
#
# saas-macos-medium-m1 is a real macOS host on Apple Silicon. The colima
# runner cannot stand in for it: colima is a Linux VM, so its runner
# reports platform=linux and takes the else branch above.
#
# Tag builds only (rc, final, and artifact refreshes — the same set
# publish-pypi ships): SaaS macOS minutes bill at a premium,
# and this guards releases, not every commit.
.tag-release-rules: &tag-release-rules
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4}|rc\d{1,3})?$/'

pytest-macos:
  stage: test
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  variables:
    # Prove the darwin branch is the one under test; a Linux runner
    # picking this job up would fail here instead of passing silently.
    PAVEDB_EXPECT_PLATFORM: darwin
  before_script:
    - sw_vers
    - python3 -m venv .venv && . .venv/bin/activate
    - python -c "import sys; assert sys.platform == 'darwin', sys.platform"
  script:
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
    # The macOS-only guard: runtime=direct must refuse to run with FAISS.
    - python -c "import pave.embedders.sbert as s, sys; print('darwin guard present:', 'darwin' in open(s.__file__).read())"
    - pytest -q
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 1 week
  <<: *tag-release-rules

# The published images are arm64 since the runner moved (ROADMAP C7), so
# the same tags also get tested on arm64 Linux — the colima box.
pytest-arm64:
  stage: test
  tags:
    - m4-colima
  image: python:3.11
  script:
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
    - python -c "import platform; print('arch:', platform.machine())"
    - pytest -q
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 1 week
  <<: *tag-release-rules

bench:
  stage: benchmark
  variables:
    # Cold local runners download the model on first run; give startup headroom.
    BENCH_STARTUP_TIMEOUT_S: "120"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git make
  script:
    - >-
      LAT_SLO_P99_MS=${LAT_SLO_P99_MS:-2000}
      STR_MAX_ERROR_PCT=${STR_MAX_ERROR_PCT:-1}
      BENCH_FORCE_EPHEMERAL=1
      BENCH_SAVE=1
      LAT_LENGTH=${LAT_LENGTH:-200}
      LAT_CONCUR=${LAT_CONCUR:-8}
      STR_LENGTH=${STR_LENGTH:-30}
      STR_CONCUR=${STR_CONCUR:-4}
      TORCH_WHEEL_CPU=1
      make benchmark
  artifacts:
    when: always
    paths:
      - benchmarks/results/
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

chaos-nightly:
  stage: benchmark
  tags:
    - xeon
  variables:
    BENCH_FORCE_EPHEMERAL: "1"
    BENCH_STARTUP_TIMEOUT_S: "120"
    TORCH_WHEEL_CPU: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git make
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - pip install ".[test]" -q
  script:
    - >-
      bash -o pipefail -c
      'CHAOS_DURATION="${CHAOS_DURATION:-120}"
      CHAOS_CONCUR="${CHAOS_CONCUR:-24}"
      make chaos 2>&1 | tee chaos.log'
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        python scripts/issue_key_sync.py chaos-failure
      fi
  artifacts:
    when: always
    paths:
      - chaos.log
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true

# PyPI publish for final releases only (vX.Y.Z)
publish-pypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - test -n "${PYPI_TOKEN:-}" || { echo "PYPI_TOKEN is missing"; exit 1; }
    - export TWINE_USERNAME="__token__"
    - export TWINE_PASSWORD="${PYPI_TOKEN}"
    - twine upload dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

# GitLab PyPI: all versioned tags (final, rc, alpha, beta, etc.)
publish-gitlab-pypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - |
      test -n "${CI_DEPLOY_USER:-}" || { echo "CI_DEPLOY_USER is missing"; exit 1; }
      test -n "${CI_DEPLOY_PASSWORD:-}" || { echo "CI_DEPLOY_PASSWORD is missing"; exit 1; }
    - twine upload --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/* -u "$CI_DEPLOY_USER" -p "$CI_DEPLOY_PASSWORD"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}\S{0,16}$/'

# Test PyPI: release candidates only (vX.Y.Zrc0-rc999)
publish-testpypi:
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build
    - python scripts/check_dist_manifest.py dist/*
    - test -n "${TEST_PYPI_TOKEN:-}" || { echo "TEST_PYPI_TOKEN is missing"; exit 1; }
    - export TWINE_USERNAME="__token__"
    - export TWINE_PASSWORD="${TEST_PYPI_TOKEN}"
    - twine upload --repository-url "https://test.pypi.org/legacy/" dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}rc\d{1,3}$/'

# Docker: release candidates (CPU only)
publish-docker-rc:
  stage: release
  tags:
    - xeon
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export IMAGE_BASE="$CI_REGISTRY_IMAGE/pavedb"
    - export IMAGE_TAG="$VERSION-cpu"
    - export LATEST_TAG="latest-cpu"
    - export BUILD_ID="${CI_PIPELINE_ID:-0}-${CI_COMMIT_SHORT_SHA:-dev}-cpu"
    - docker build --progress=plain --build-arg TORCH_WHEEL_CPU=1 --build-arg BUILD_ID="$BUILD_ID" -t "$IMAGE_BASE:$IMAGE_TAG" -f Dockerfile .
    - docker push "$IMAGE_BASE:$IMAGE_TAG"
    - docker tag "$IMAGE_BASE:$IMAGE_TAG" "$IMAGE_BASE:$LATEST_TAG"
    - docker push "$IMAGE_BASE:$LATEST_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}rc\d{1,3}$/'

# Docker: final releases — CPU image only. CUDA is disabled here; build it
# locally with `make docker-build RELEASE_TORCH=cuda` (or `=both`). See
# THIRD_PARTY_LICENSES.md for why the published image stays CPU-only.
publish-docker:
  stage: release
  tags:
    - xeon
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export IMAGE_BASE="$CI_REGISTRY_IMAGE/pavedb"
    - export BUILD_ID_CPU="${CI_PIPELINE_ID:-0}-${CI_COMMIT_SHORT_SHA:-dev}-cpu"
    - docker build --progress=plain --build-arg TORCH_WHEEL_CPU=1 --build-arg BUILD_ID="$BUILD_ID_CPU" -t "$IMAGE_BASE:$VERSION-cpu" -f Dockerfile .
    - docker push "$IMAGE_BASE:$VERSION-cpu"
    - docker tag "$IMAGE_BASE:$VERSION-cpu" "$IMAGE_BASE:latest-cpu"
    - docker push "$IMAGE_BASE:latest-cpu"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'

# Runtime pip-freeze snapshot: the exact CPU runtime closure at release time,
# kept as a reproducibility reference (documentation only, not an enforced
# lockfile). Published as a labelled artifact for rc and stable tags.
publish-freeze:
  stage: release
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export PYTAG="$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')"
    - export FREEZE="pavedb-runtime-${VERSION}-${PYTAG}-linux_x86_64-cpu.txt"
    - python -m pip install --upgrade pip -q
    - pip install -r requirements-cpu.txt -q
    - |
      {
        echo "# PaveDB runtime dependency freeze"
        echo "# Release: v${VERSION}  Python: ${PYTAG}  Platform: linux_x86_64 (CPU)"
        echo "# Reproducibility reference, not an enforced lockfile."
        echo "# Reuse: pip install . -c ${FREEZE} \\"
        echo "#   --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple"
        python -m pip freeze | grep -v '@ file://'
      } > "$FREEZE"
    - echo "Wrote ${FREEZE}:"; head -8 "$FREEZE"
  artifacts:
    paths:
      - "pavedb-runtime-*.txt"
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}(\.\d{1,4})?$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}rc\d{1,3}$/'

announce-gitlab:
  stage: announce
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  dependencies:
    - validate-release-announcement
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "$(cat release-title.txt)" \
        --notes-file "release-notes.md" \
        --ref "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

announce-github:
  stage: announce
  image: alpine:3.20
  variables:
    GITHUB_MIRROR_REPO: rodrigopitanga/pavedb
  dependencies:
    - validate-release-announcement
  before_script:
    - apk add --no-cache git github-cli
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - export GH_TOKEN="$GITHUB_MIRROR_TOKEN"
    - |
      git ls-remote --exit-code \
        "https://github.com/${GITHUB_MIRROR_REPO}.git" \
        "refs/tags/${CI_COMMIT_TAG}"
    - |
      title="$(cat release-title.txt)"
      notes="release-notes.md"
      if gh release view "$CI_COMMIT_TAG" \
        --repo "$GITHUB_MIRROR_REPO" >/dev/null 2>&1
      then
        gh release edit "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --title "$title" --notes-file "$notes" --verify-tag
      else
        gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --title "$title" --notes-file "$notes" --verify-tag
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
